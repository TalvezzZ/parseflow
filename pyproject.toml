[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "parse-agent"
version = "0.8.0"
description = "基于 LangChain 和可插拔 Skill 的文档解析 Agent 平台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "mammoth>=1.8.0",
    "markdownify>=0.13.1",
    "beautifulsoup4>=4.12.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "Pillow>=10.0.0",
    "pdf-inspector>=0.2.6",
    "pydantic-settings>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "python-multipart>=0.0.9",
    "defusedxml>=0.7.1",
    "striprtf>=0.0.29",
]

[project.scripts]
parse-agent-mcp = "app.mcp_server:main"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
ocr = [
    "paddlepaddle>=3.0.0,<4.0.0",
    "paddleocr>=3.0.0,<4.0.0",
    "pypdfium2>=4.30.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
