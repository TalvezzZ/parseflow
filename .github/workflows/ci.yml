name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run tests
        run: uv run pytest

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan dependency manifests and lock files
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv and Python
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install backend dependencies
        working-directory: .
        run: uv sync --frozen --no-dev
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real-backend browser tests
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore

  docker-runtime:
    name: Docker runtime smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and smoke hardened container
        run: ./scripts/docker-runtime-smoke.sh

      - name: Scan hardened container image
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          scan-type: image
          image-ref: ${{ env.PARSEFLOW_IMAGE }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish-image:
    name: Publish signed container image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, dependency-scan, frontend, browser-e2e, docker-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      - name: Validate release tag and authenticate to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          project_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$version" = "$project_version"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          echo "PARSEFLOW_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "PARSEFLOW_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build, publish, and attest image
        id: build_release
        run: |
          docker buildx create --name parseflow-release --use
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform linux/amd64 \
            --tag "$PARSEFLOW_IMAGE:$PARSEFLOW_VERSION" \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --push .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build-metadata.json")"
          test -n "$digest" && test "$digest" != "null"
          echo "PARSEFLOW_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "PARSEFLOW_RELEASE_REF=$PARSEFLOW_IMAGE@$digest" >> "$GITHUB_ENV"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "release_ref=$PARSEFLOW_IMAGE@$digest" >> "$GITHUB_OUTPUT"

      - name: Smoke-test exact published digest
        env:
          PARSEFLOW_IMAGE: ${{ steps.build_release.outputs.release_ref }}
          PARSEFLOW_SMOKE_SKIP_BUILD: "true"
        run: |
          docker pull "$PARSEFLOW_IMAGE"
          ./scripts/docker-runtime-smoke.sh

      - name: Scan exact published digest
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          scan-type: image
          image-ref: ${{ steps.build_release.outputs.release_ref }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Sign and verify the validated digest
        run: |
          image="${PARSEFLOW_RELEASE_REF%@*}"
          observed_digest="$(docker buildx imagetools inspect "$image:$PARSEFLOW_VERSION" | awk '$1 == "Digest:" { print $2; exit }')"
          test "$observed_digest" = "$PARSEFLOW_DIGEST"
          cosign sign --yes "$PARSEFLOW_RELEASE_REF"
          cosign verify \
            --certificate-identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/tags/$GITHUB_REF_NAME" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "$PARSEFLOW_RELEASE_REF"
          printf 'Published `%s:%s`\nDigest: `%s`\n' "$image" "$PARSEFLOW_VERSION" "$PARSEFLOW_DIGEST" >> "$GITHUB_STEP_SUMMARY"
